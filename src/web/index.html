<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Digest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-elevated: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --success: #34d399;
      --error: #f87171;
      --border: #334155;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .page {
      /* Wide enough that two digests still get a generous column each; the
         digest HTML inside each iframe caps its own line length, so extra
         width becomes margin rather than unreadably long lines. */
      max-width: 1600px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .logo .tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-link {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
    }
    .nav-link:hover { color: var(--accent); }

    .run-all-btn {
      font-family: inherit;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: var(--bg);
      border: none;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .run-all-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3);
    }
    .run-all-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-muted);
    }
    .status-pill.running {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }
    .status-pill.success {
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
    }
    .status-pill.failure {
      background: rgba(248, 113, 113, 0.15);
      color: var(--error);
    }

    .columns {
      display: grid;
      /* auto-fit rather than a fixed count: the number of digests is per
         instance (three on the security one, one per reader on a topic one),
         and auto-fit collapses the tracks it doesn't need -- so two digests
         split the width equally instead of occupying two thirds of a
         three-column grid. The minmax floor also handles narrow screens, which
         is why there are no breakpoints here any more. */
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      /* No effect on two- or three-column layouts, whose grid tracks are
         already narrower than this. It only stops a lone digest stretching the
         full page width on a large screen, which reads as a sea of empty space
         around one centred column of text. */
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 0 0;
      letter-spacing: -0.01em;
    }

    .card-actions {
      padding: 16px 24px;
    }
    .card-btn {
      font-family: inherit;
      background: var(--bg-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .card-btn:hover:not(:disabled) {
      background: var(--border);
      border-color: var(--accent);
      color: var(--accent);
    }
    .card-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .card-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 24px 24px;
    }
    .card-content iframe {
      flex: 1;
      min-height: 420px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      width: 100%;
    }

    .empty-state {
      padding: 32px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="logo">
        <div class="logo-icon" id="siteIcon">🛡</div>
        <div>
          <h1 id="siteTitle">Security Digest</h1>
          <span class="tagline" id="siteTagline">Curated news for security consultants</span>
        </div>
      </div>
      <div class="header-actions">
        <a href="/history" class="nav-link">History</a>
        <div id="status" class="status-pill"></div>
        <button id="runAll" class="run-all-btn" onclick="handleRunAll()">Run all digests</button>
      </div>
    </header>

    <div class="columns" id="columns"></div>
  </div>

  <script>
    function getAdminToken(forcePrompt) {
      let t = localStorage.getItem('digestAdminToken');
      if (!t || forcePrompt) {
        t = (prompt('Enter admin token (from DIGEST_ADMIN_TOKEN in .env):') || '').trim();
        if (t) localStorage.setItem('digestAdminToken', t);
      }
      return t || '';
    }

    async function adminFetch(url, opts) {
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers, { 'X-Admin-Token': getAdminToken(false) });
      let r = await fetch(url, opts);
      if (r.status === 401) {
        localStorage.removeItem('digestAdminToken');
        const t = getAdminToken(true);
        if (t) {
          opts.headers['X-Admin-Token'] = t;
          r = await fetch(url, opts);
        }
      }
      return r;
    }

    function escapeHtml(str) {
      if (str == null) return '';
      const s = String(str);
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function fetchStatus() {
      const r = await fetch('/status');
      if (!r.ok) throw new Error('Status fetch failed');
      return r.json();
    }

    async function fetchDigestsInfo() {
      const r = await fetch('/api/digests');
      if (!r.ok) throw new Error('Digests fetch failed');
      return r.json();
    }

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    async function triggerRun(slug) {
      const url = slug ? `/run?digest=${encodeURIComponent(slug)}` : '/run';
      const r = await adminFetch(url, { method: 'POST' });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.message || data.detail || 'Run request failed');
      return data;
    }

    // What is currently on screen, so a poll that changes nothing touches nothing.
    // Rebuilding the markup destroys and recreates every <iframe>, which reloads
    // the digest and throws away the reader's scroll position -- so a page that
    // polls while you are reading is a page you cannot read.
    let renderedDigests = null;   // signature of the digest set currently drawn
    let renderedVersion = null;   // which run's content the iframes are showing

    function digestCardMarkup(d, version) {
      const slug = d.slug;
      const escapedTitle = escapeHtml(d.title);
      const src = `/digests/${encodeURIComponent(slug)}${version ? `?v=${encodeURIComponent(version)}` : ''}`;
      return `
          <article class="card">
            <div class="card-header">
              <h2 class="card-title">${escapedTitle}</h2>
            </div>
            <div class="card-actions">
              <button class="card-btn" data-slug="${escapeHtml(slug)}" data-action="run-digest">Run ${escapedTitle}</button>
            </div>
            <div class="card-content">
              <iframe src="${src}" data-slug="${escapeHtml(slug)}" title="${escapedTitle}"></iframe>
            </div>
          </article>
        `;
    }

    function renderColumns(digests, status) {
      const el = document.getElementById('columns');
      const running = status.status === 'running';

      // While a run is in progress the output hasn't changed yet, so keep showing
      // what we have. Settling to success/failure is the one moment worth
      // reloading -- which makes it exactly one reload per run, at the end.
      const version = running ? renderedVersion : (status.last_run || '');
      const signature = JSON.stringify(digests.map(d => [d.slug, d.title]));

      if (signature !== renderedDigests) {
        el.innerHTML = digests.map(d => digestCardMarkup(d, version)).join('');
        renderedDigests = signature;
        renderedVersion = version;
      } else if (version !== renderedVersion) {
        // Same digests, new content: swap the iframe sources in place rather
        // than rebuilding the cards, so nothing else on the page flickers.
        el.querySelectorAll('iframe[data-slug]').forEach((frame) => {
          const slug = frame.getAttribute('data-slug');
          frame.src = `/digests/${encodeURIComponent(slug)}?v=${encodeURIComponent(version)}`;
        });
        renderedVersion = version;
      }

      // Cheap and idempotent, so it can run on every poll.
      el.querySelectorAll('.card-btn[data-slug]').forEach(btn => { btn.disabled = running; });
      document.getElementById('runAll').disabled = running;
    }

    document.getElementById('columns').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'run-digest' && btn.dataset.slug !== undefined) {
        handleRunDigest(btn.dataset.slug, btn);
      }
    });

    async function handleRunAll() {
      const btn = document.getElementById('runAll');
      btn.disabled = true;
      try {
        const data = await triggerRun(null);
        if (!data.ok) {
          document.getElementById('status').textContent = data.message || 'Error';
          btn.disabled = false;
          return;
        }
        startRefreshInterval();
      } catch (err) {
        document.getElementById('status').textContent = err.message || 'Request failed';
        btn.disabled = false;
      }
    }

    async function handleRunDigest(slugVal, btn) {
      btn.disabled = true;
      try {
        const data = await triggerRun(slugVal);
        if (!data.ok) {
          document.getElementById('status').textContent = data.message || 'Error';
          btn.disabled = false;
          return;
        }
        startRefreshInterval();
      } catch (err) {
        document.getElementById('status').textContent = err.message || 'Request failed';
        btn.disabled = false;
      }
    }

    let refreshInterval;
    let refreshDeadline;

    // Poll quickly only while a run is actually in progress, then stop. The
    // previous version polled every 3s for a flat two minutes regardless, so a
    // run that finished in forty seconds left the page reloading itself for
    // another eighty with nothing new to show.
    function startRefreshInterval() {
      stopRefreshInterval();
      refreshInterval = setInterval(async () => {
        const stillRunning = await refresh();
        if (!stillRunning) stopRefreshInterval();
      }, 3000);
      // Safety net only: if a run never reports finishing (crashed worker,
      // status write failed) this stops the page polling forever.
      refreshDeadline = setTimeout(stopRefreshInterval, 600000);
    }

    function stopRefreshInterval() {
      clearInterval(refreshInterval);
      clearTimeout(refreshDeadline);
      refreshInterval = undefined;
      refreshDeadline = undefined;
    }

    function renderStatus(s) {
      const el = document.getElementById('status');
      const status = s.status || 'idle';
      let text;
      if (status === 'running') {
        text = 'Running…';
      } else if (status === 'success') {
        const parts = [formatDate(s.last_run)];
        if ((s.items_processed || 0) > 0) parts.unshift(`${s.items_processed} items`);
        else if (s.previous_delivered) parts.unshift('Previous re-sent');
        else parts.unshift('0 items');
        text = parts.join(' · ');
      } else if (status === 'failure') {
        text = `Failed: ${(s.error || 'Unknown').slice(0, 40)}`;
      } else {
        text = s.last_run ? `Last: ${formatDate(s.last_run)}` : 'Ready';
      }
      el.textContent = text;
      el.className = 'status-pill ' + status;
    }

    async function refresh() {
      try {
        const [status, digests] = await Promise.all([fetchStatus(), fetchDigestsInfo()]);
        renderStatus(status);
        renderColumns(digests, status);
        return status.status === 'running';
      } catch (err) {
        const el = document.getElementById('status');
        el.textContent = 'Update failed';
        el.className = 'status-pill failure';
        return false;   // stop polling rather than hammer an endpoint that is failing
      }
    }

    // Branding comes from config: one codebase serves every instance, so the
    // markup above is only a fallback for a failed request, not the real name.
    async function loadSite() {
      try {
        const r = await fetch('/api/site');
        if (!r.ok) return;
        const s = await r.json();
        if (s.title) { document.getElementById('siteTitle').textContent = s.title; document.title = s.title; }
        if (s.tagline) document.getElementById('siteTagline').textContent = s.tagline;
        if (s.icon) document.getElementById('siteIcon').textContent = s.icon;
      } catch (e) { /* keep the markup defaults */ }
    }

    loadSite();
    refresh();
    // Slow background poll for runs started elsewhere (the scheduler, another
    // browser). It is safe at this cadence now that refresh() only touches the
    // DOM when something actually changed.
    setInterval(async () => {
      if (refreshInterval) return;              // a fast poll is already running
      if (await refresh()) startRefreshInterval();
    }, 60000);
  </script>
</body>
</html>
