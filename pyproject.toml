[project]
name = "security-digest"
version = "0.1.0"
description = "Fetches, summarises and categorises security/news items with an LLM, then delivers digests by email on a schedule"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }

dependencies = [
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "markdown>=3.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "apscheduler>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

# `src/` is run in place (`python -m src.main`, `uvicorn src.web.app:app`), not
# installed as an importable package -- there's no `src/__init__.py` and no
# distributable module name distinct from the checkout layout. Telling uv not
# to build/install the project itself avoids needing a build backend and a
# package list that don't reflect how this repo actually runs.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
